# Upkeep's pinned tools and tasks. Each part is a private Bun workspace
# package under packages/, with its own lint, typecheck and test scripts; these
# tasks run them across every package. CI runs check, test and build; the hk
# pre-push hook runs the shared lint steps.
min_version = "2025.1.0"

[tools]
node = "26.13.0"
bun = "1.4.4"
# The linters the shared hk pre-push hook runs, matching CI.
uv = "0.13.6"
# yamllint's PyYAML has no wheels for Python 3.15 yet, which mise lock needs.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.0"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"
sources = ["package.json", "packages/*/package.json", "bun.lock"]

[tasks.dev]
description = "Run the upkeep CLI in watch mode in the foreground; agents use serve:cli"
depends = ["install"]
dir = "packages/cli"
run = "bun run dev"

[tasks."serve:cli"]
description = "Start the CLI in watch mode in the background through pitchfork"
run = "pitchfork start cli"

[tasks."serve:cli:status"]
description = "Show the background CLI's status"
run = "pitchfork status cli"

[tasks."serve:cli:logs"]
description = "Follow the background CLI's logs"
run = "pitchfork logs -t cli"

[tasks."serve:cli:restart"]
description = "Restart the background CLI"
run = "pitchfork restart cli"

[tasks."serve:cli:stop"]
description = "Stop the background CLI"
run = "pitchfork stop cli"

[tasks.build]
description = "Compile a minified, bytecode-cached upkeep binary to dist/upkeep"
depends = ["install"]
dir = "packages/cli"
run = ["bun run build", "mkdir -p ../../dist", "cp dist/upkeep ../../dist/upkeep"]

[tasks.test]
description = "Run every package's tests"
depends = ["install"]
run = "bun run --filter './packages/*' test"

[tasks.lint]
description = "Lint every package with the shared Oxlint rules"
depends = ["install"]
run = "bun run --filter './packages/*' lint"

[tasks.typecheck]
description = "Type-check every package"
depends = ["install"]
run = "bun run --filter './packages/*' typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.check]
description = "Lint, type-check and verify formatting"
depends = ["lint", "typecheck", "format:check"]
