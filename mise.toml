# Upkeep's pinned tools and tasks. Each part is a private Bun workspace
# package under packages/, with its own lint, typecheck and test scripts; these
# tasks run them across every package. CI runs check, test and build; the hk
# pre-push hook runs the shared lint steps.
min_version = "2025.1.0"

[tools]
node = "26.13.1"
bun = "1.4.4"
# The linters the shared hk pre-push hook runs, matching CI.
uv = "0.13.8"
# yamllint's PyYAML has no wheels for Python 3.15 yet, which mise lock needs.
python = "3.14.10"
"pipx:yamllint" = "1.38.0"
"npm:markdownlint-cli2" = "0.24.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"

[tasks.install]
description = "Install dependencies"
run = "bun install --frozen-lockfile"
sources = ["package.json", "packages/*/package.json", "docs/package.json", "bun.lock"]

[tasks."docs:dev"]
description = "Run the docs dev server in the foreground; agents use serve:docs"
depends = ["install"]
dir = "docs"
# A reused Vite cache makes every page fail to resolve Astro's ClientRouter script
run = ["rm -rf .blume/.cache/vite", "bun run dev"]

[tasks."docs:build"]
description = "Build the docs site"
depends = ["install"]
dir = "docs"
run = "bun run build"

[tasks."docs:check"]
description = "Check the docs site's content and links"
depends = ["install"]
dir = "docs"
run = "bun run check"

[tasks."docs:preview"]
description = "Preview the built docs site"
dir = "docs"
run = "bun run preview"

[tasks."serve:docs"]
description = "Start the docs dev server in the background through Pitchfork"
run = "pitchfork start docs"

[tasks."serve:docs:status"]
description = "Show the background docs dev server status"
run = "pitchfork status docs"

[tasks."serve:docs:logs"]
description = "Follow the background docs dev server logs"
run = "pitchfork logs -t docs"

[tasks."serve:docs:restart"]
description = "Restart the background docs dev server"
run = "pitchfork restart docs"

[tasks."serve:docs:stop"]
description = "Stop the background docs dev server"
run = "pitchfork stop docs"

[tasks.dev]
description = "Run the upkeep CLI in watch mode in the foreground; agents use serve:cli"
depends = ["install"]
dir = "packages/cli"
run = "bun run dev"

[tasks."serve:cli"]
description = "Start the CLI in watch mode in the background through pitchfork"
run = "pitchfork start cli"

[tasks."serve:cli:status"]
description = "Show the background CLI's status"
run = "pitchfork status cli"

[tasks."serve:cli:logs"]
description = "Follow the background CLI's logs"
run = "pitchfork logs -t cli"

[tasks."serve:cli:restart"]
description = "Restart the background CLI"
run = "pitchfork restart cli"

[tasks."serve:cli:stop"]
description = "Stop the background CLI"
run = "pitchfork stop cli"

[tasks."serve:server"]
description = "Start the server in watch mode in the background through Pitchfork"
depends = ["install"]
run = "pitchfork start server"

[tasks."serve:server:status"]
description = "Show the background server's status"
run = "pitchfork status server"

[tasks."serve:server:logs"]
description = "Follow the background server's logs"
run = "pitchfork logs -t server"

[tasks."serve:server:restart"]
description = "Restart the background server"
run = "pitchfork restart server"

[tasks."serve:server:stop"]
description = "Stop the background server"
run = "pitchfork stop server"

[tasks.build]
description = "Compile a minified, bytecode-cached upkeep binary to dist/upkeep, and the OpenCode plugin's TUI part"
depends = ["install", "build:opencode"]
dir = "packages/cli"
run = ["bun run build", "mkdir -p ../../dist", "cp dist/upkeep ../../dist/upkeep"]

[tasks."build:opencode"]
description = "Compile the OpenCode plugin's TUI part to packages/opencode/dist/tui.js"
depends = ["install"]
dir = "packages/opencode"
run = "bun run build"

[tasks.test]
description = "Run every package's tests"
depends = ["install"]
run = "bun run --filter './packages/*' test"

[tasks.lint]
description = "Lint every package with the shared Oxlint rules"
depends = ["install"]
run = "bun run --filter './packages/*' lint"

[tasks.typecheck]
description = "Type-check every package"
depends = ["install"]
run = "bun run --filter './packages/*' typecheck"

[tasks.format]
description = "Format source and configuration"
depends = ["install"]
run = "bun run format"

[tasks."format:check"]
description = "Check formatting without writing"
depends = ["install"]
run = "bun run format:check"

[tasks.renovate-presets]
description = "Regenerate the Renovate built-in presets the deps job reads"
run = "bun scripts/renovate-presets.ts"

[tasks.check]
description = "Lint, type-check, verify formatting and check the docs"
depends = ["lint", "typecheck", "format:check", "docs:check"]
