---
# Builds the upkeep-git Arch package on each push to main that changes the
# binary, for the machines that run workers. The Home Assistant app is
# released separately, through release.yml.
name: Publish Arch git package

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - packages/*/src/**
      - packages/*/package.json
      - package.json
      - bun.lock
      - LICENSE
      - .scripts/linux/**
      - .github/workflows/publish-arch-git.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: publish-arch-git-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Arch package (upkeep-git)
    uses: timmo001/workflows/.github/workflows/build-arch-package.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0
    with:
      package-name: upkeep-git
    secrets:
      ARCH_REPO_DISPATCH_TOKEN: ${{ secrets.ARCH_REPO_DISPATCH_TOKEN }}
