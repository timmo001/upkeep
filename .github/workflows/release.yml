---
# Builds the Home Assistant app image for each architecture on a published
# release, tags one multi-arch manifest at ghcr.io/timmo001/upkeep-app, then
# has timmo001/home-assistant-apps copy the app in.
name: Release

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # The Supervisor pulls the image tagged with the app's version, so the two
  # have to match.
  version:
    name: Check app version
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Compare with the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version: //p' home-assistant/app/config.yaml)"
          if [ "$version" != "$TAG" ]; then
            echo "::error title=App version::Tag $TAG doesn't match home-assistant/app/config.yaml's version $version. Tags are the bare version, with no v"
            exit 1
          fi

  # One multi-arch image, each architecture built on its own native runner.
  image:
    name: Container image
    needs: version
    permissions:
      contents: read
      packages: write
    uses: timmo001/workflows/.github/workflows/build-container-image.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      image: ghcr.io/timmo001/upkeep-app
      version: ${{ github.event.release.tag_name }}
      home-assistant: true
      build-args: UPKEEP_BUILD_VERSION=${{ github.event.release.tag_name }}

  # Asks timmo001/home-assistant-apps to copy this release's app folder, now
  # its image is pushed.
  home-assistant-apps:
    name: Home Assistant apps repository
    needs: image
    uses: timmo001/workflows/.github/workflows/home-assistant-app-dispatch.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
    with:
      repository: timmo001/home-assistant-apps
    secrets:
      token: ${{ secrets.RELEASE_COMMIT_TOKEN }}
