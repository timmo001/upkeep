---
# Checks every push and pull request: check, test and build through the shared
# Bun CLI workflow, then the shared lint workflows.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@056c2aa0b36cbd28bfa721b936589a369b1331bd # 20261108.1
    with:
      smoke-test: |-
        ./dist/upkeep --help
        ./dist/upkeep --version

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@056c2aa0b36cbd28bfa721b936589a369b1331bd # 20261108.1

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@056c2aa0b36cbd28bfa721b936589a369b1331bd # 20261108.1

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@056c2aa0b36cbd28bfa721b936589a369b1331bd # 20261108.1

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@056c2aa0b36cbd28bfa721b936589a369b1331bd # 20261108.1
