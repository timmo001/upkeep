---
# Checks every push and pull request: check, test and build through the shared
# Bun CLI workflow, then the shared lint workflows.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
    with:
      smoke-test: |-
        ./dist/upkeep --help
        ./dist/upkeep --version

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@ec70016a91999259142a156104978174490a0831 # 20261110.0
