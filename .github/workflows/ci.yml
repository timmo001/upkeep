---
# Checks every push and pull request: check, test and build through the shared
# Bun CLI workflow, then the shared lint workflows.
name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: timmo001/workflows/.github/workflows/build-bun-cli.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2
    with:
      smoke-test: |-
        ./dist/upkeep --help
        ./dist/upkeep --version

  actionlint:
    uses: timmo001/workflows/.github/workflows/lint-actionlint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2

  markdownlint:
    uses: timmo001/workflows/.github/workflows/lint-markdownlint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2

  yamllint:
    uses: timmo001/workflows/.github/workflows/lint-yamllint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2

  jsonlint:
    uses: timmo001/workflows/.github/workflows/lint-jsonlint.yml@f39552735dd1e0766144bfd674cd5d11af1676c9 # 20261108.2
